<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllDay Coffee</title>
    
    <!-- SEO and Meta Tags -->
    <meta name="description" content="AllDay Coffee - 프리미엄 원두와 함께하는 완벽한 하루">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#/" class="logo">
                <i class="ph-fill ph-coffee"></i>
                <span>AllDay</span>
            </a>
            <div class="nav-links" id="navLinks">
                <!-- Injected via JS based on auth status -->
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app">
        <!-- Dynamic Content Injected Here -->
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-logo">AllDay Coffee</div>
            <p>프리미엄 원두로 당신의 하루를 응원합니다.</p>
        </div>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
